<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>INI Supply Archive</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="app-header">
      <h1>INI SUPPLY ARCHIVE</h1>
    </header>

    <!-- カレンダー -->
    <section class="calendar-section">

      <div class="calendar-header">

        <button
          id="prevMonth"
          type="button"
          aria-label="前の月"
        >
          ‹
        </button>

        <button
          id="monthPickerButton"
          class="month-picker-button"
          type="button"
          aria-label="年月を選択"
        >
          <span id="currentMonth"></span>
        </button>

        <button
          id="nextMonth"
          type="button"
          aria-label="次の月"
        >
          ›
        </button>

      </div>

      <div class="weekdays">
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
        <div>土</div>
        <div>日</div>
      </div>

      <div
        id="calendar"
        class="calendar-grid"
      ></div>

      <div class="calendar-legend">
        <span class="dot youtube-dot"></span>
        <span>YouTube</span>
      </div>

    </section>

    <!-- 選択した日の供給 -->
    <section class="supplies-section">

      <h2 id="selectedDate">
        日付を選択してください
      </h2>

      <div id="supplyList"></div>

    </section>


    <!-- 年月選択 -->
    <div
      id="monthPicker"
      class="month-picker-overlay"
      hidden
    >

      <div class="month-picker">

        <h2>年月を選択</h2>

        <div class="month-picker-selects">

          <label>
            <span>年</span>
            <select id="yearSelect"></select>
          </label>

          <label>
            <span>月</span>
            <select id="monthSelect"></select>
          </label>

        </div>

        <div class="month-picker-actions">

          <button
            id="monthPickerCancel"
            type="button"
          >
            キャンセル
          </button>

          <button
            id="monthPickerGo"
            type="button"
          >
            移動
          </button>

        </div>

      </div>

    </div>

  </main>


  <!-- 下部ナビゲーション -->
  <nav class="bottom-nav">

    <button
      class="nav-item active"
      type="button"
    >
      <span>CALENDAR</span>
    </button>

    <button
      class="nav-item"
      type="button"
    >
      <span>EXPLORE</span>
    </button>

  </nav>


  <script src="app.js"></script>

</body>
</html>
