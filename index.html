<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>INI Supply Archive</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="app">

    <!-- =========================
         CALENDAR画面
    ========================== -->

    <div id="calendarView">

      <header class="app-header">
        <h1>INI SUPPLY ARCHIVE</h1>
      </header>

      <section class="calendar-section">

        <div class="calendar-header">

          <button
            id="prevMonth"
            type="button"
            aria-label="前の月"
          >
            ‹
          </button>

          <button
            id="monthPickerButton"
            class="month-picker-button"
            type="button"
            aria-label="年月を選択"
          >
            <span id="currentMonth"></span>
          </button>

          <button
            id="nextMonth"
            type="button"
            aria-label="次の月"
          >
            ›
          </button>

        </div>


        <div class="weekdays">
          <div>月</div>
          <div>火</div>
          <div>水</div>
          <div>木</div>
          <div>金</div>
          <div>土</div>
          <div>日</div>
        </div>


        <div
          id="calendar"
          class="calendar-grid"
        ></div>


        <!-- カレンダー凡例 -->

        <div class="calendar-legend">

          <div class="calendar-legend-item">

            <span
              class="dot youtube-dot"
            ></span>

            <span>YouTube</span>

          </div>


          <div class="calendar-legend-item">

            <span
              class="dot fc-dot"
            ></span>

            <span>FC Contents</span>

          </div>

        </div>

      </section>


      <!-- =========================
           選択した日の供給
      ========================== -->

      <section class="supplies-section">

        <h2 id="selectedDate">
          日付を選択してください
        </h2>

        <div id="supplyList"></div>

      </section>

    </div>


    <!-- =========================
         EXPLORE画面
    ========================== -->

    <div
      id="exploreView"
      hidden
    >

      <header class="app-header">
        <h1>EXPLORE</h1>
      </header>


      <section class="explore-section">

        <!-- =====================
             キーワード検索
        ====================== -->

        <div class="explore-search">

          <span
            class="explore-search-icon"
            aria-hidden="true"
          >
            ⌕
          </span>

          <input
            id="exploreSearchInput"
            class="explore-search-input"
            type="search"
            placeholder="タイトル・メンバー名で検索"
            autocomplete="off"
            aria-label="供給を検索"
          >

        </div>


        <!-- =====================
             カテゴリフィルター
        ====================== -->

        <div class="explore-filter">

          <span class="explore-filter-label">
            カテゴリ
          </span>


          <button
            id="exploreCategoryButton"
            class="explore-category-button"
            type="button"
            aria-haspopup="dialog"
            aria-controls="categorySheet"
            aria-expanded="false"
          >

            <span
              id="exploreCategoryLabel"
              class="explore-category-label"
            >
              すべて
            </span>


            <span
              class="explore-category-arrow"
              aria-hidden="true"
            >
              ›
            </span>

          </button>

        </div>


        <!-- =====================
             検索結果情報
        ====================== -->

        <div class="explore-result-header">

          <span id="exploreResultLabel">
            ALL
          </span>

          <span id="exploreResultCount"></span>

        </div>


        <!-- =====================
             供給一覧
        ====================== -->

        <div id="exploreList"></div>


        <!-- =====================
             さらに表示
        ====================== -->

        <button
          id="exploreLoadMore"
          class="explore-load-more"
          type="button"
          hidden
        >
          さらに表示
        </button>

      </section>

    </div>


    <!-- =========================
         DETAIL画面
    ========================== -->

    <div
      id="detailView"
      class="detail-view"
      hidden
    >

      <header class="detail-header">

        <button
          id="detailBackButton"
          class="detail-back-button"
          type="button"
          aria-label="前の画面に戻る"
        >
          ‹
        </button>

        <span>DETAIL</span>

        <div class="detail-header-space"></div>

      </header>


      <section class="detail-content">

        <!-- =====================
             サムネイル

             YouTubeのみ表示。
             Member Diaryでは
             JavaScript側で非表示。
        ====================== -->

        <div
          id="detailThumbnailWrapper"
          class="detail-thumbnail-wrapper"
        >

          <img
            id="detailThumbnail"
            class="detail-thumbnail"
            src=""
            alt=""
          >

        </div>


        <!-- =====================
             コンテンツ種別
        ====================== -->

        <div
          id="detailType"
          class="detail-type"
        ></div>


        <!-- =====================
             タイトル
        ====================== -->

        <h1
          id="detailTitle"
          class="detail-title"
        ></h1>


        <!-- =====================
             公開日
        ====================== -->

        <p
          id="detailDate"
          class="detail-date"
        ></p>


        <!-- =====================
             メンバー名

             Member Diaryのみ表示
        ====================== -->

        <p
          id="detailMember"
          class="detail-member"
          hidden
        ></p>


        <!-- =====================
             外部リンク
        ====================== -->

        <a
          id="detailExternalLink"
          class="detail-external-link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span id="detailExternalLinkText">
            外部サイトで見る
          </span>

          <span aria-hidden="true">
            ↗
          </span>

        </a>

      </section>

    </div>


    <!-- =========================
         年月選択
    ========================== -->

    <div
      id="monthPicker"
      class="month-picker-overlay"
      hidden
    >

      <div class="month-picker">

        <h2>年月を選択</h2>


        <div class="month-picker-selects">

          <label>

            <span>年</span>

            <select id="yearSelect"></select>

          </label>


          <label>

            <span>月</span>

            <select id="monthSelect"></select>

          </label>

        </div>


        <div class="month-picker-actions">

          <button
            id="monthPickerCancel"
            type="button"
          >
            キャンセル
          </button>

          <button
            id="monthPickerGo"
            type="button"
          >
            移動
          </button>

        </div>

      </div>

    </div>


    <!-- =========================
         カテゴリ選択
         ボトムシート
    ========================== -->

    <div
      id="categorySheet"
      class="category-sheet-overlay"
      hidden
    >

      <div
        class="category-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="categorySheetTitle"
      >

        <!--
          iPhoneのボトムシートらしい
          上部のハンドル
        -->

        <div
          class="category-sheet-handle"
          aria-hidden="true"
        ></div>


        <!-- =====================
             ヘッダー
        ====================== -->

        <div class="category-sheet-header">

          <h2 id="categorySheetTitle">
            カテゴリを選択
          </h2>


          <button
            id="categorySheetClose"
            class="category-sheet-close"
            type="button"
            aria-label="カテゴリ選択を閉じる"
          >
            ×
          </button>

        </div>


        <!-- =====================
             カテゴリ一覧
        ====================== -->

        <div class="category-sheet-options">


          <!-- すべて -->

          <button
            class="category-sheet-option selected"
            type="button"
            data-category="all"
          >

            <span
              class="category-sheet-check"
              aria-hidden="true"
            >
              ✓
            </span>

            <span
              class="category-sheet-option-label"
            >
              すべて
            </span>

          </button>


          <!-- YouTube -->

          <button
            class="category-sheet-option"
            type="button"
            data-category="youtube"
          >

            <span
              class="category-sheet-check"
              aria-hidden="true"
            ></span>


            <span
              class="category-sheet-option-label"
            >

              <span
                class="dot youtube-dot"
              ></span>

              <span>
                YouTube
              </span>

            </span>

          </button>


          <!-- MEMBER DIARY -->

          <button
            class="category-sheet-option"
            type="button"
            data-category="member_diary"
          >

            <span
              class="category-sheet-check"
              aria-hidden="true"
            ></span>


            <span
              class="category-sheet-option-label"
            >

              <span
                class="dot fc-dot"
              ></span>

              <span>
                Member Diary
              </span>

            </span>

          </button>

                    <!-- Movie -->

          <button
            class="category-sheet-option"
            type="button"
            data-category="movie"
          >

            <span
              class="category-sheet-check"
              aria-hidden="true"
            ></span>


            <span
              class="category-sheet-option-label"
            >

              <span
                class="dot fc-dot"
              ></span>

              <span>
                Movie
              </span>

            </span>

          </button>

        </div>

      </div>

    </div>

  </main>


  <!-- =========================
       下部ナビゲーション
  ========================== -->

  <nav
    id="bottomNav"
    class="bottom-nav"
  >

    <button
      id="calendarNavButton"
      class="nav-item active"
      type="button"
    >

      <span>
        CALENDAR
      </span>

    </button>


    <button
      id="exploreNavButton"
      class="nav-item"
      type="button"
    >

      <span>
        EXPLORE
      </span>

    </button>

  </nav>


  <script src="app.js"></script>

</body>

</html>
