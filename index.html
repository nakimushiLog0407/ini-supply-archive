<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>INI Supply Archive</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- =========================
         CALENDAR画面
    ========================== -->

    <div id="calendarView">

      <header class="app-header">
        <h1>INI SUPPLY ARCHIVE</h1>
      </header>

      <section class="calendar-section">

        <div class="calendar-header">

          <button
            id="prevMonth"
            type="button"
            aria-label="前の月"
          >
            ‹
          </button>

          <button
            id="monthPickerButton"
            class="month-picker-button"
            type="button"
            aria-label="年月を選択"
          >
            <span id="currentMonth"></span>
          </button>

          <button
            id="nextMonth"
            type="button"
            aria-label="次の月"
          >
            ›
          </button>

        </div>

        <div class="weekdays">
          <div>月</div>
          <div>火</div>
          <div>水</div>
          <div>木</div>
          <div>金</div>
          <div>土</div>
          <div>日</div>
        </div>

        <div
          id="calendar"
          class="calendar-grid"
        ></div>

        <!-- カレンダー凡例 -->

        <div class="calendar-legend">

          <div class="calendar-legend-item">
            <span class="dot youtube-dot"></span>
            <span>YouTube</span>
          </div>

          <div class="calendar-legend-item">
            <span class="dot fc-dot"></span>
            <span>FC CONTENTS</span>
          </div>

        </div>

      </section>


      <!-- 選択した日の供給 -->

      <section class="supplies-section">

        <h2 id="selectedDate">
          日付を選択してください
        </h2>

        <div id="supplyList"></div>

      </section>

    </div>


    <!-- =========================
         EXPLORE画面
    ========================== -->

    <div
      id="exploreView"
      hidden
    >

      <header class="app-header">
        <h1>EXPLORE</h1>
      </header>

      <section class="explore-section">

        <!-- 検索 -->

        <div class="explore-search">

          <span
            class="explore-search-icon"
            aria-hidden="true"
          >
            ⌕
          </span>

          <input
            id="exploreSearchInput"
            class="explore-search-input"
            type="search"
            placeholder="タイトル・メンバー名で検索"
            autocomplete="off"
            aria-label="供給を検索"
          >

        </div>


        <!-- 検索結果情報 -->

        <div class="explore-result-header">

          <span id="exploreResultLabel">
            ALL
          </span>

          <span id="exploreResultCount"></span>

        </div>


        <!-- 供給一覧 -->

        <div id="exploreList"></div>


        <!-- さらに表示 -->

        <button
          id="exploreLoadMore"
          class="explore-load-more"
          type="button"
          hidden
        >
          さらに表示
        </button>

      </section>

    </div>


    <!-- =========================
         DETAIL画面
    ========================== -->

    <div
      id="detailView"
      class="detail-view"
      hidden
    >

      <header class="detail-header">

        <button
          id="detailBackButton"
          class="detail-back-button"
          type="button"
          aria-label="前の画面に戻る"
        >
          ‹
        </button>

        <span>DETAIL</span>

        <div class="detail-header-space"></div>

      </header>


      <section class="detail-content">

        <!--
          サムネイル
          YouTubeの場合のみ表示。
          Member DiaryではJavaScript側で
          wrapperごと非表示にする。
        -->

        <div
          id="detailThumbnailWrapper"
          class="detail-thumbnail-wrapper"
        >

          <img
            id="detailThumbnail"
            class="detail-thumbnail"
            src=""
            alt=""
          >

        </div>


        <!-- コンテンツ種別 -->

        <div
          id="detailType"
          class="detail-type"
        ></div>


        <!-- タイトル -->

        <h1
          id="detailTitle"
          class="detail-title"
        ></h1>


        <!-- 公開日 -->

        <p
          id="detailDate"
          class="detail-date"
        ></p>


        <!--
          メンバー名
          Member Diaryの場合のみ表示
        -->

        <p
          id="detailMember"
          class="detail-member"
          hidden
        ></p>


        <!-- 外部リンク -->

        <a
          id="detailExternalLink"
          class="detail-external-link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span id="detailExternalLinkText">
            外部サイトで見る
          </span>

          <span aria-hidden="true">↗</span>
        </a>

      </section>

    </div>


    <!-- =========================
         年月選択
    ========================== -->

    <div
      id="monthPicker"
      class="month-picker-overlay"
      hidden
    >

      <div class="month-picker">

        <h2>年月を選択</h2>

        <div class="month-picker-selects">

          <label>
            <span>年</span>
            <select id="yearSelect"></select>
          </label>

          <label>
            <span>月</span>
            <select id="monthSelect"></select>
          </label>

        </div>

        <div class="month-picker-actions">

          <button
            id="monthPickerCancel"
            type="button"
          >
            キャンセル
          </button>

          <button
            id="monthPickerGo"
            type="button"
          >
            移動
          </button>

        </div>

      </div>

    </div>

  </main>


  <!-- =========================
       下部ナビゲーション
  ========================== -->

  <nav
    id="bottomNav"
    class="bottom-nav"
  >

    <button
      id="calendarNavButton"
      class="nav-item active"
      type="button"
    >
      <span>CALENDAR</span>
    </button>

    <button
      id="exploreNavButton"
      class="nav-item"
      type="button"
    >
      <span>EXPLORE</span>
    </button>

  </nav>


  <script src="app.js"></script>

</body>

</html>
