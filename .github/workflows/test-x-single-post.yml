name: Test X Single Post

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-x-single-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run X single post diagnostic
        run: |
          python scripts/test_x_single_post.py
