name: Generate X Import Candidates

on:
  workflow_dispatch:
    inputs:
      x_urls:
        description: "Xの投稿URLを改行または空白区切りで入力"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-x-import-candidates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate X import candidates
        env:
          X_URLS: ${{ inputs.x_urls }}
        run: |
          python scripts/generate_x_import_candidates.py

      - name: Validate candidate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/x_import_candidates.json")

          with path.open(
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          if not isinstance(data, list):
              raise SystemExit(
                  "x_import_candidates.json must be an array"
              )

          print(
              f"Candidate count: {len(data)}"
          )
          PY

      - name: Commit candidate data
        run: |
          if git diff --quiet -- data/x_import_candidates.json; then
            echo "No candidate changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/x_import_candidates.json
          git commit -m "Update X import candidates"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
