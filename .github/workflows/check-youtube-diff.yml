name: Check YouTube Diff

on:
  # 診断用なので手動実行のみ
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-youtube-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check YouTube diff
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/check_youtube_diff.py
