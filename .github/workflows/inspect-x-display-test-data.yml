name: Inspect X Display Test Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch and print X test data
        working-directory: scripts
        run: |
          python - <<'PY'
          import json
          from test_x_match import normalize_x_url, fetch_post

          urls = [
              "https://x.com/official__ini/status/1403943009188663305?s=46",
              "https://x.com/official__ini/status/1403956315836194820?s=46",
          ]

          for index, url in enumerate(urls, start=1):
              item = normalize_x_url(url)
              if not item:
                  raise SystemExit(f"Could not normalize URL: {url}")

              post = fetch_post(item)
              if not post:
                  raise SystemExit(f"Could not fetch post: {url}")

              output = dict(post)
              created = output.get("created_at_jst")
              output["created_at_jst"] = created.isoformat() if created else None

              print(f"=== TEST POST {index} ===")
              print(json.dumps(output, ensure_ascii=False, indent=2))

          print("ALL DISPLAY TEST DATA FETCHED")
          PY
