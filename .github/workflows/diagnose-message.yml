name: Diagnose INI Message

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Message diagnosis
        run: |
          python scripts/diagnose_message.py
