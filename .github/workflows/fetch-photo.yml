name: Fetch INI Photo

on:
  # 手動実行
  workflow_dispatch:

  # 毎日22:46（日本時間）に自動実行
  schedule:
    - cron: "46 22 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

# データ取得Workflow同士を同時実行しない。
concurrency:
  group: ini-data-fetch
  cancel-in-progress: false

jobs:
  fetch-photo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Photo data
        run: python scripts/fetch_photo.py

      - name: Check generated Photo data
        run: |
          echo "===== data/photo.json ====="

          if [ ! -f data/photo.json ]; then
            echo "ERROR: data/photo.json が生成されていません。"
            exit 1
          fi

          python - <<'PY'
          import json

          path = "data/photo.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print(f"Photo count: {len(data)}")

          if not data:
              raise RuntimeError(
                  "Photoデータが0件です。"
              )

          print()
          print("Oldest:")
          print(
              json.dumps(
                  data[0],
                  ensure_ascii=False,
                  indent=2
              )
          )

          print()
          print("Newest:")
          print(
              json.dumps(
                  data[-1],
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      - name: Commit Photo data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/photo.json

          echo "===== git status ====="
          git status --short

          if git diff --cached --quiet; then
            echo "data/photo.json に変更はありません。"
            exit 0
          fi

          git commit -m "Update Photo data"
          git push
