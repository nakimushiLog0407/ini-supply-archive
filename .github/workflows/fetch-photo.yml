name: Fetch INI Photo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-photo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Photo data
        run: python scripts/fetch_photo.py

      - name: Check generated Photo data
        run: |
          echo "===== data/photo.json ====="

          if [ ! -f data/photo.json ]; then
            echo "ERROR: data/photo.json が生成されていません。"
            exit 1
          fi

          python - <<'PY'
          import json

          path = "data/photo.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print(f"Photo count: {len(data)}")

          if not data:
              raise RuntimeError(
                  "Photoデータが0件です。"
              )

          print()
          print("Oldest:")
          print(
              json.dumps(
                  data[0],
                  ensure_ascii=False,
                  indent=2
              )
          )

          print()
          print("Newest:")
          print(
              json.dumps(
                  data[-1],
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      - name: Commit Photo data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先にgit addする。
          # これにより、新規作成された未追跡の
          # data/photo.json もGitの判定対象になる。
          git add data/photo.json

          echo "===== git status ====="
          git status --short

          # git add後のステージ済み差分を確認する。
          # 新規ファイルもここでは正しく検出される。
          if git diff --cached --quiet; then
            echo "data/photo.json に変更はありません。"
            exit 0
          fi

          git commit -m "Update Photo data"
          git push
