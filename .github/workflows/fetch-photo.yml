name: Fetch INI Photo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-photo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Photo data
        run: python scripts/fetch_photo.py

      - name: Check generated Photo data
        run: |
          echo "===== data/photo.json ====="
          python - <<'PY'
          import json

          path = "data/photo.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print(f"Photo count: {len(data)}")

          if data:
              print()
              print("Oldest:")
              print(json.dumps(data[0], ensure_ascii=False, indent=2))

              print()
              print("Newest:")
              print(json.dumps(data[-1], ensure_ascii=False, indent=2))
          PY

      - name: Commit Photo data
        run: |
          if git diff --quiet -- data/photo.json; then
            echo "data/photo.json に変更はありません。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/photo.json
          git commit -m "Update Photo data"
          git push
