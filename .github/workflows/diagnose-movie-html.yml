name: Diagnose Movie HTML

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-movie-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose Movie HTML
        run: python scripts/diagnose_movie_html.py
