name: Debug Member Diary

on:
  workflow_dispatch:

jobs:
  debug-member-diary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect Member Diary HTML
        run: python scripts/debug_member_diary.py
