name: Test X Content Match

on:
  workflow_dispatch:
    inputs:
      x_urls:
        description: "Xの投稿URLを改行または空白区切りで入力"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-x-match:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run X existing content match diagnostic
        env:
          X_URLS: ${{ inputs.x_urls }}
        run: |
          python scripts/test_x_match.py
