name: Fetch Member Diary

on:
  # 手動実行
  workflow_dispatch:

  # 毎日22:31（日本時間）に自動実行
  schedule:
    - cron: "31 22 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

# データ取得Workflow同士を同時実行しない。
concurrency:
  group: ini-data-fetch
  cancel-in-progress: false

jobs:
  fetch-member-diary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Member Diary
        run: python scripts/fetch_member_diary.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/member_diary.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Member Diary data"
            git push
          fi
