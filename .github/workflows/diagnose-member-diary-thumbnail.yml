name: Diagnose Member Diary Thumbnail

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose Member Diary Thumbnail
        run: python scripts/diagnose_member_diary_thumbnail.py
